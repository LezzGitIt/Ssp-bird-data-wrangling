abstract: |
  Silvopastoral systems—the integration of trees and shrubs into grazing landscapes—are increasingly recognized as a biodiversity-friendly land-use strategy in tropical regions. These systems may enhance bird diversity by provisioning resources, facilitating movement, mitigating the negative effects of fragmentation, and potentially enhancing species persistence. However, empirical data evaluating these effects remain limited, particularly across broad spatial and environmental gradients in the tropics. Here, we compile and harmonize six bird monitoring datasets collected between 2013 and 2026 as part of the Colombian Sustainable Cattle Ranching (SCR) project. The SCR project began planting trees around 2012 and facilitated the transformation of approximately 160,000 hectares of farms with degraded pasture to silvopasture, primarily by integrating live fences and dispersed trees. Of the more than 4,000 farms participating in the SCR project, bird surveys were conducted on 73 farms across 12 departments. The surveys spanned five distinct ecoregions, including tropical dry forest, Andean montane forest, and the plains of the Orinoco river basin. Observers recorded 587 bird species within 62 taxonomic families at 504 unique point-count locations. Locations were sampled between 1 and 19 times (2,999 surveys in total), with 75% of locations visited ≥3 times within a closed sampling period, enabling estimation of detection probabilities through hierarchical occupancy models. Surveyed land use and land cover types included mature forest, forest fragments, riparian forest, cropland, intensive pasture, silvopasture, and heterogeneous mosaics of different land cover types. This dataset supports analyses of bird diversity patterns and community composition across land-use gradients, including evaluations of the effects of silvopastoral practices on biodiversity in tropical cattle ranching landscapes. While survey methodologies were not standardized across different sampling datasets, we document methodological differences, allowing for the variation in survey effort or methodology to be accounted for statistically. This collation represents one of the most extensive datasets available to date for assessing avian responses to silvopastoral management. The data are fully available for utilization and research.
