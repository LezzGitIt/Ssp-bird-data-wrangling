abstract: |
  Silvopastoral systems - the integration of trees and shrubs into grazing landscapes -are increasingly recognized as a biodiversity-friendly land-use strategy in tropical regions. These systems may enhance bird diversity by provisioning resources, facilitating movement, mitigating the negative effects of fragmentation, and ultimately supporting species persistence. However, empirical data to evaluate these effects remain scarce. Here, we compile six bird monitoring datasets collected between 2013 and 2026 as part of the Sustainable Cattle Ranching (SCR) project in Colombia. The SCR project began planting trees around 2012, and the project managed to transform ~160,000 hectares of degraded pasture to silvopasture, primarily by integrating live fences and dispersed trees. Of the >4,000 farms that were part of the SCR project, data collectors sampled birds on 73 farms across 12 departments. The surveys span five distinct ecoregions, including tropical dry forest, Andean montane forest, and the plains of the Orinoco river basin. Data collectors observed 587 bird species within 62 families at 504 unique point count locations. Point counts were sampled 1–19 times (2,996 total surveys), with 75% of locations visited ≥3 times within a closed sampling period, enabling estimation of detection probabilities through hierarchical models. Land-use landcover types surveyed include mature forest, forest fragments, riparian forest, crops, intensive pasture, silvopasture, and heterogeneous mosaics (i.e., no single dominant landcover type). This dataset supports analyses of bird diversity patterns and community composition across land-use gradients, especially the effects of silvopastoral practices on biodiversity in tropical productive landscapes. While survey methodologies were not standardized across data collectors, we report the important distinctions, allowing for differences in survey effort or methodology to be accounted for statistically. This collation represents the most extensive dataset available to date for assessing avian responses to silvopastoral management. The data are fully available for utilization and research. Please cite this data paper when utilizing the data.
keywords: 
  - agroforestry, biodiversity, birds, Colombia, forest fragmentation, land-use landcover gradient, point counts, silvopasture, sustainable cattle ranching project, tropical
  
