# Project-level Quarto config for the data-paper manuscript (Scripts/qmd/).
# The manuscript uses format: elsevier-pdf (from _extensions/), which inherits
# the `pdf` settings below (incl. the custom Suppfiles/title.tex partial).

project:
  type: default
  execute-dir: project
  output-dir: Rendered/
  pre-render: clean_stale_render_output.R
  post-render: flatten_rendered_pdf.R
format:
  pdf:
    pdf-engine: lualatex
    toc: true
    toc-depth: 3
    author-affiliations: true
    template-partials:
      - Suppfiles/title.tex
    include-in-header:
      text: |
        \usepackage[noblocks]{authblk}
        \renewcommand*{\Authsep}{, }
        \renewcommand*{\Authand}{, }
        \renewcommand*{\Authands}{, }
        \renewcommand\Affilfont{\small}
editor_options:
  chunk_output_type: console
